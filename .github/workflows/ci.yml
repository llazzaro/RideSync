name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Repository configuration unit tests
        run: python -m unittest discover -s test -v
      - name: Native camera and source configuration tests
        run: pio test -e native
      - name: C++ format check
        run: python scripts/check_format.py
      - name: Build ESP32 firmware
        run: pio run -e lilygo_t_a7670e_r2
