[platformio]
default_envs = lilygo_t_a7670e_r2

[env:lilygo_t_a7670e_r2]
platform = espressif32@6.12.0
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
  platformio/tool-esptoolpy@2.40900.250804
  platformio/tool-scons@4.40801.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=5
  -DCONFIG_BT_NIMBLE_MAX_BONDS=5
  -DCONFIG_BT_NIMBLE_MAX_CCCDS=32
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -Wl,--wrap=esp_partition_erase_range
  -Wl,--wrap=nvs_flash_init
  -Wl,-u,__wrap_esp_partition_erase_range
  -Wl,-u,__wrap_nvs_flash_init
extra_scripts = pre:scripts/patch_nimble_store.py
lib_deps =
  https://github.com/sparkfun/SparkFun_BMI270_Arduino_Library.git#21ea234de321da07c552f7a43cb36f7df4f73a27
  https://github.com/h2zero/NimBLE-Arduino.git#dfb4ac561a06797081be9e752902a6582e7f029e
; Selected source only: physical IMU remains disabled.

; Host C++ runner: PlatformIO Core 6.1.18 (requirements-dev.txt), Unity 2.6.1.
[env:native]
platform = native@1.2.1
build_flags = -std=c++11
build_src_filter = +<*> -<main.cpp>
test_build_src = yes
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1

; Link the full concrete backend while preserving disabled activation. This proves
; SDK symbol compatibility, not physical startup/security/camera qualification.
[env:ble_central_compile]
extends = env:lilygo_t_a7670e_r2
build_flags =
  ${env:lilygo_t_a7670e_r2.build_flags}
  -Wl,-u,ridesync_ble_qualification_backend
  -Wl,-u,ridesync_ble_pairing_reset_backend

; Link the real shared host, HERO12 adapter and boot-lifetime composition while
; leaving application activation disabled until commissioning supplies proof.
[env:hero12_adapter_compile]
extends = env:ble_central_compile
build_flags =
  ${env:ble_central_compile.build_flags}
  -fstack-usage
  -Wl,-u,ridesync_hero12_runtime
  -Wl,-u,ridesync_hero12_service
  -DRIDESYNC_SD_HANDOFF_COMPILE
  -Wl,-u,ridesync_sd_session_qualification

  -Wl,-u,ridesync_local_telemetry_start
  -Wl,-u,ridesync_local_telemetry_service
  -Wl,-u,ridesync_local_telemetry_runtime

  -Wl,-u,ridesync_handlebar_runtime
  -Wl,-u,ridesync_handlebar_begin
  -Wl,-u,ridesync_handlebar_service

  -Wl,-u,ridesync_supervised_application
  -Wl,-u,ridesync_application_pairing_reset_backend

  -Wl,-u,ridesync_insta360_gps_encoder_backend
  -Wl,-u,ridesync_insta360_gps_forwarding_backend

; Retain the real wake worker and raw advertising SDK path, activation disabled.
[env:insta360_wake_compile]
extends = env:ble_central_compile
build_flags =
  ${env:ble_central_compile.build_flags}
  -Wl,-u,ridesync_insta360_wake_backend

; Retain the concrete CE80 backend without commissioning or advertising.
[env:x5_adapter_compile]
extends = env:ble_central_compile
build_flags =
  ${env:ble_central_compile.build_flags}
  -fstack-usage
  -Wl,-u,ridesync_x5_peripheral_backend
  -Wl,-u,ridesync_x5_runtime

; Actual serial route; a missing private provider explicitly refuses commissioning.
[env:x5_serial_milestone]
extends = env:x5_adapter_compile
build_flags =
  ${env:x5_adapter_compile.build_flags}
  -DRIDESYNC_X5_SERIAL_MILESTONE

; Private read-only commissioning observation. No camera/radio activity.
[env:x5_store_inspect]
extends = env:x5_serial_milestone
build_flags =
  ${env:x5_serial_milestone.build_flags}
  -DRIDESYNC_X5_STORE_INSPECT

; Optional composed wake + CE80 serial path; missing private provider stays inert.
[env:x5_wake_milestone]
extends = env:x5_serial_milestone
build_flags =
  ${env:x5_serial_milestone.build_flags}
  -DRIDESYNC_X5_WAKE_MILESTONE

; Real GO 3S FFFrame adapter on the shared host; commissioning/activation opt-in.
[env:go3s_adapter_compile]
extends = env:ble_central_compile
build_flags =
  ${env:ble_central_compile.build_flags}
  -Wl,-u,ridesync_go3s_runtime
  -Wl,-u,ridesync_go3s_service

; Experimental ONE RS BE80 explicit commands on shared host, activation opt-in.
[env:one_rs_adapter_compile]
extends = env:ble_central_compile
build_flags =
  ${env:ble_central_compile.build_flags}
  -Wl,-u,ridesync_one_rs_runtime
  -Wl,-u,ridesync_one_rs_service
