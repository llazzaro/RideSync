[platformio]
src_dir = ../../..
include_dir = ../../../include

[env:sd_logging]
platform = espressif32@6.12.0
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
  platformio/tool-esptoolpy@2.40900.250804
  platformio/tool-scons@4.40801.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -Wl,--wrap=nvs_flash_init
  -Wl,-u,__wrap_nvs_flash_init
extra_scripts = pre:build_guard.py
build_src_filter =
  -<*>
  +<src/storage.cpp>
  +<src/storage_sd.cpp>
  +<src/session_identity.cpp>
  +<src/session_storage_owner.cpp>
  +<src/session_clock.cpp>
  +<src/health_supervisor.cpp>
  +<tools/bench/sd_logging/main.cpp>
upload_speed = 115200
