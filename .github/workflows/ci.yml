name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Repository configuration unit tests
        run: python -m unittest discover -s test -v
      - name: SD bench admission and lifetime checks
        run: python tools/bench/sd_logging/test_run.py -v
      - name: X5 peripheral capture policy checks
        run: python tools/bench/x5_peripheral/test_capture.py -v
      - name: Production GNSS bench lifecycle checks
        run: python tools/bench/gnss_driver/test_bench.py -v
      - name: Native camera and source configuration tests
        run: pio test -e native
      - name: C++ format check
        run: python scripts/check_format.py
      - name: Build ESP32 firmware
        run: pio run -e lilygo_t_a7670e_r2
      - name: Link all opt-in BLE central SDK operations (activation disabled)
        run: pio run -e ble_central_compile
      - name: Link opt-in Insta360 wake SDK worker (activation disabled)
        run: pio run -e insta360_wake_compile
      - name: Link opt-in HERO12 adapter with the shared ESP32 host (activation disabled)
        run: |
          pio run -e hero12_adapter_compile
          python - <<'PYCODE'
          import os, subprocess
          symbols = subprocess.check_output([os.path.expanduser('~/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm'), '.pio/build/hero12_adapter_compile/firmware.elf'], text=True)
          assert any(line.endswith(' ridesync_insta360_gps_forwarding_backend') for line in symbols.splitlines()), 'GPS forwarding service was not retained'
          assert not any(line.endswith(' ridesync_x5_peripheral_backend') for line in symbols.splitlines()), 'HERO12 image unexpectedly retains the X5 backend'
          PYCODE
      - name: Link opt-in GO 3S FFFrame adapter with shared host (activation disabled)
        run: pio run -e go3s_adapter_compile
      - name: Link experimental ONE RS BE80 command profile (activation disabled)
        run: pio run -e one_rs_adapter_compile
      - name: Build production X5 backend and uncommissioned serial milestone
        run: pio run -e x5_adapter_compile -e x5_serial_milestone -e x5_store_inspect -e x5_wake_milestone
      - name: Audit retained pure GPS encoder (compile only)
        run: python scripts/probe_gps_encoder_resources.py --elf .pio/build/hero12_adapter_compile/firmware.elf --build-dir .pio/build/hero12_adapter_compile --nm "$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm" --objdump "$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-objdump"
      - name: Build isolated SD bench diagnostics (compile only)
        env:
          RIDESYNC_BENCH_NAMESPACE: '1'
          RIDESYNC_BENCH_WRITE_OPT_IN: '1'
        run: |
          pio run -d tools/bench/sd_readonly
          pio run -d tools/bench/sd_logging
      - name: Build and audit isolated X5 peripheral probe (compile only)
        run: |
          pio run -d tools/bench/x5_peripheral
          python tools/bench/x5_peripheral/inspect_link.py --nm "$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm" --objdump "$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-objdump"
      - name: Build and audit isolated production GNSS diagnostic (compile only)
        run: |
          pio run -d tools/bench/gnss_driver
          python tools/bench/gnss_driver/inspect_link.py --nm "$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm" --objdump "$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-objdump"
