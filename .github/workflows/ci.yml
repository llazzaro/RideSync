name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Repository configuration unit tests
        run: python -m unittest discover -s test -v
      - name: SD bench admission and lifetime checks
        run: python tools/bench/sd_logging/test_run.py -v
      - name: X5 peripheral capture policy checks
        run: python tools/bench/x5_peripheral/test_capture.py -v
      - name: Native camera and source configuration tests
        run: pio test -e native
      - name: C++ format check
        run: python scripts/check_format.py
      - name: Build ESP32 firmware
        run: pio run -e lilygo_t_a7670e_r2
      - name: Link all opt-in BLE central SDK operations (activation disabled)
        run: pio run -e ble_central_compile
      - name: Link opt-in HERO12 adapter with the shared ESP32 host (activation disabled)
        run: pio run -e hero12_adapter_compile
      - name: Build isolated SD bench diagnostics (compile only)
        env:
          RIDESYNC_BENCH_NAMESPACE: '1'
          RIDESYNC_BENCH_WRITE_OPT_IN: '1'
        run: |
          pio run -d tools/bench/sd_readonly
          pio run -d tools/bench/sd_logging
      - name: Build and audit isolated X5 peripheral probe (compile only)
        run: |
          pio run -d tools/bench/x5_peripheral
          python tools/bench/x5_peripheral/inspect_link.py --nm "$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-nm" --objdump "$HOME/.platformio/packages/toolchain-xtensa-esp32/bin/xtensa-esp32-elf-objdump"
