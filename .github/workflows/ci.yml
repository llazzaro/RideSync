name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Repository configuration unit tests
        run: python -m unittest discover -s test -v
      - name: Native camera and source configuration tests
        run: pio test -e native
      - name: C++ format check
        run: python scripts/check_format.py
      - name: Build ESP32 firmware
        run: pio run -e lilygo_t_a7670e_r2
      - name: Link all opt-in BLE central SDK operations (activation disabled)
        run: pio run -e ble_central_compile
