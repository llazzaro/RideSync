version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "mechanical/**"
    open-pull-requests-limit: 2
    ignore:
      # PlatformIO Core upgrades are deliberate; keep supported security updates eligible.
      - dependency-name: "platformio"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "pip"
    directory: "/mechanical/tracer900_2018"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
